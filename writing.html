<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Writing – French Practice</title>
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .writing-wrapper {
      width: 100%;
      max-width: 500px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .writing-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Accent Helper Bar */
    .accent-bar {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }

    .accent-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      min-width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.1s;
    }

    .accent-btn:active {
      background-color: #e2e8f0;
    }

    /* Distraction-Free Plain Writing Area */
    .writing-textarea {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: none;
      outline: none;
      resize: none;
      padding: 18px;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #1e293b;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    .writing-textarea::placeholder {
      color: #94a3b8;
    }

    /* Bottom Status Strip inside Card */
    .writing-footer-bar {
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      flex-shrink: 0;
    }

    .clear-text-btn {
      background: none;
      border: none;
      color: #dc2626;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Spelling Results Panel (Hidden until "Check Spelling" is clicked) */
    .spell-results {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      max-height: 34dvh;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      flex-shrink: 0;
    }

    .spell-results.open {
      display: flex;
    }

    .spell-results-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      flex-shrink: 0;
    }

    .spell-close-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .spell-list {
      list-style: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spell-item {
      padding: 10px 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      font-size: 0.88rem;
    }

    .spell-word {
      font-weight: 700;
      color: #dc2626;
      text-decoration: line-through;
      margin-right: 6px;
    }

    .spell-msg {
      color: #475569;
      font-size: 0.82rem;
      margin: 4px 0 6px;
    }

    .spell-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .suggestion-chip {
      background: #ffffff;
      border: 1px solid #2563eb;
      color: #1d4ed8;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .suggestion-chip:active {
      background: #eff6ff;
    }

    .spell-ok {
      padding: 14px;
      text-align: center;
      color: #15803d;
      background: #f0fdf4;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Slide-Out Navigation Drawer -->
  <div class="nav-overlay" id="nav-overlay" onclick="toggleMenu()"></div>
  <nav class="nav-drawer" id="nav-drawer">
    <div class="nav-drawer-header">
      <span class="nav-drawer-title">French Practice</span>
      <button class="close-menu-btn" onclick="toggleMenu()">✕</button>
    </div>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">📖 Home (Reading)</a></li>
      <li><a href="listening.html" class="nav-link">🎧 Listening</a></li>
      <li><a href="speaking.html" class="nav-link">🗣️ Speaking</a></li>
      <li><a href="writing.html" class="nav-link active">✍️ Writing</a></li>
    </ul>
  </nav>

  <!-- Top Bar -->
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">☰</button>
      <span>Writing Practice</span>
    </div>
    <button class="pill-btn" onclick="copyText()" id="copy-btn">📋 Copy</button>
  </div>

  <!-- Main Writing Area -->
  <div class="writing-wrapper">
    <div class="writing-card">
      <!-- French Accent Helper Buttons -->
      <div class="accent-bar">
        <button type="button" class="accent-btn" onclick="insertChar('é')">é</button>
        <button type="button" class="accent-btn" onclick="insertChar('è')">è</button>
        <button type="button" class="accent-btn" onclick="insertChar('ê')">ê</button>
        <button type="button" class="accent-btn" onclick="insertChar('à')">à</button>
        <button type="button" class="accent-btn" onclick="insertChar('â')">â</button>
        <button type="button" class="accent-btn" onclick="insertChar('ç')">ç</button>
        <button type="button" class="accent-btn" onclick="insertChar('ù')">ù</button>
        <button type="button" class="accent-btn" onclick="insertChar('û')">û</button>
        <button type="button" class="accent-btn" onclick="insertChar('ô')">ô</button>
        <button type="button" class="accent-btn" onclick="insertChar('î')">î</button>
        <button type="button" class="accent-btn" onclick="insertChar('ï')">ï</button>
        <button type="button" class="accent-btn" onclick="insertChar('œ')">œ</button>
      </div>

      <!-- Plain Textarea with All Auto-Correction & Spellcheck Disabled -->
      <textarea
        id="writing-area"
        class="writing-textarea"
        placeholder="Écrivez votre texte en français ici..."
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        data-gramm="false"
        oninput="updateStats()"
      ></textarea>

      <!-- Word Count & Clear -->
      <div class="writing-footer-bar">
        <span id="word-stats">0 mots • 0 caractères</span>
        <button type="button" class="clear-text-btn" onclick="clearEditor()">Clear</button>
      </div>
    </div>

    <!-- On-Demand Spelling Check Results -->
    <div class="spell-results" id="spell-results">
      <div class="spell-results-header">
        <span id="spell-summary">Spelling Check</span>
        <button class="spell-close-btn" onclick="closeSpellResults()">✕</button>
      </div>
      <ul class="spell-list" id="spell-list"></ul>
    </div>
  </div>

  <!-- Bottom Action Button -->
  <div class="controls">
    <button class="nav-btn btn-flip" id="check-btn" onclick="checkSpelling()">Check Spelling</button>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('nav-drawer').classList.toggle('open');
      document.getElementById('nav-overlay').classList.toggle('open');
    }

    const writingArea = document.getElementById('writing-area');
    const wordStats = document.getElementById('word-stats');
    const checkBtn = document.getElementById('check-btn');
    const spellResults = document.getElementById('spell-results');
    const spellSummary = document.getElementById('spell-summary');
    const spellList = document.getElementById('spell-list');
    const copyBtn = document.getElementById('copy-btn');

    function updateStats() {
      const text = writingArea.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = writingArea.value.length;
      wordStats.textContent = `${words} ${words <= 1 ? 'mot' : 'mots'} • ${chars} caractères`;
    }

    function insertChar(char) {
      const start = writingArea.selectionStart;
      const end = writingArea.selectionEnd;
      const text = writingArea.value;
      writingArea.value = text.substring(0, start) + char + text.substring(end);
      writingArea.focus();
      writingArea.selectionStart = writingArea.selectionEnd = start + char.length;
      updateStats();
    }

    function clearEditor() {
      if (!writingArea.value) return;
      if (confirm('Clear all text?')) {
        writingArea.value = '';
        updateStats();
        closeSpellResults();
      }
    }

    function copyText() {
      if (!writingArea.value.trim()) return;
      navigator.clipboard.writeText(writingArea.value).then(() => {
        copyBtn.textContent = '✓ Copied';
        setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1500);
      });
    }

    function closeSpellResults() {
      spellResults.classList.remove('open');
    }

    // Apply a suggested replacement at the exact offset
    function applyReplacement(offset, length, replacement) {
      const current = writingArea.value;
      writingArea.value = current.slice(0, offset) + replacement + current.slice(offset + length);
      updateStats();
      checkSpelling(); // Re-check so remaining offsets stay accurate
    }

    async function checkSpelling() {
      const text = writingArea.value.trim();
      if (!text) {
        alert('Please write some French text first.');
        return;
      }

      checkBtn.disabled = true;
      checkBtn.textContent = 'Checking...';

      try {
        const params = new URLSearchParams();
        params.append('text', writingArea.value);
        params.append('language', 'fr');

        const response = await fetch('https://api.languagetool.org/v2/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        });

        if (!response.ok) throw new Error('Spellcheck service unavailable');
        const data = await response.json();

        // Filter primarily for spelling / typographical / accent issues
        const matches = data.matches || [];

        spellResults.classList.add('open');

        if (matches.length === 0) {
          spellSummary.textContent = 'Result';
          spellList.innerHTML = `<li class="spell-ok">Aucune faute d'orthographe détectée !</li>`;
        } else {
          spellSummary.textContent = `${matches.length} ${matches.length === 1 ? 'point à vérifier' : 'points à vérifier'}`;
          spellList.innerHTML = matches.map(m => {
            const wrongText = writingArea.value.substr(m.offset, m.length);
            const replacements = (m.replacements || []).slice(0, 4);
            const chipsHTML = replacements.length > 0
              ? replacements.map(r => {
                  const safeVal = r.value.replace(/'/g, "\\'");
                  return `<button type="button" class="suggestion-chip" onclick="applyReplacement(${m.offset}, ${m.length}, '${safeVal}')">${r.value}</button>`;
                }).join('')
              : `<span style="font-size:0.78rem; color:#64748b;">No automatic suggestion</span>`;

            return `
              <li class="spell-item">
                <div><span class="spell-word">${wrongText}</span></div>
                <div class="spell-msg">${m.message}</div>
                <div class="spell-suggestions">${chipsHTML}</div>
              </li>
            `;
          }).join('');
        }
      } catch (err) {
        spellResults.classList.add('open');
        spellSummary.textContent = 'Offline / Error';
        spellList.innerHTML = `<li class="spell-item">Unable to connect to the French spellchecker right now. Check your internet connection and try again.</li>`;
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check Spelling';
      }
    }
  </script>
</body>
</html>
