<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>French Reading Flashcards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100dvh;
      padding: 16px;
      overflow: hidden;
    }

    /* Top Bar */
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }

    .pill-btn:active {
      background-color: #e2e8f0;
    }

    /* 3D Card Container */
    .card-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      min-height: 0;
      perspective: 1200px;
      margin-bottom: 16px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    /* Front Face: Passage (Active by default) */
    .card-front {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      transform: rotateY(0deg);
      z-index: 2;
      pointer-events: auto;
    }

    /* Back Face: Vocabulary (Inactive until flipped) */
    .card-back {
      background-color: #0f172a;
      color: #f8fafc;
      transform: rotateY(180deg);
      z-index: 1;
      pointer-events: none;
    }

    /* Swap touch/scroll priority when flipped */
    .card.is-flipped .card-front {
      z-index: 1;
      pointer-events: none;
    }

    .card.is-flipped .card-back {
      z-index: 2;
      pointer-events: auto;
    }

    /* Card Top Header Strip */
    .card-header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      opacity: 0.7;
    }

    .flip-trigger {
      background: rgba(148, 163, 184, 0.15);
      border: none;
      color: inherit;
      padding: 5px 11px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Scrollable Content Area */
    .card-body {
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      flex: 1;
      min-height: 0;
      line-height: 1.65;
    }

    /* Passage Typography */
    .passage-context {
      font-size: 0.88rem;
      font-style: italic;
      color: #64748b;
      margin-bottom: 10px;
    }

    .passage-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .passage-paragraph {
      font-size: 1.02rem;
      color: #334155;
      margin-bottom: 14px;
    }

    .passage-paragraph:last-child {
      margin-bottom: 0;
    }

    /* Vocabulary List Typography */
    .vocab-list {
      list-style: none;
    }

    .vocab-item {
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .vocab-item:first-child {
      padding-top: 0;
    }

    .vocab-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .vocab-term {
      display: block;
      font-size: 1.02rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 2px;
    }

    .vocab-def {
      display: block;
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* Bottom Navigation Buttons */
    .controls {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      flex: 1;
      padding: 15px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s;
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-back {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-flip {
      background-color: #2563eb;
      color: #ffffff;
      flex: 1.2;
    }

    .btn-next {
      background-color: #1e293b;
      color: #ffffff;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <span id="counter">Loading...</span>
    <div class="header-actions">
      <button class="pill-btn" onclick="shuffleCards()">🔀 Shuffle</button>
    </div>
  </div>

  <!-- Flashcard -->
  <div class="card-container">
    <div class="card" id="flashcard">
      
      <!-- FRONT: Passage -->
      <div class="card-face card-front">
        <div class="card-header">
          <span class="badge">Passage</span>
          <button class="flip-trigger" onclick="flipCard()">Flip to Vocab ↻</button>
        </div>
        <div class="card-body" id="front-body">
          Loading passage...
        </div>
      </div>

      <!-- BACK: Vocabulary -->
      <div class="card-face card-back">
        <div class="card-header">
          <span class="badge">Vocabulary</span>
          <button class="flip-trigger" onclick="flipCard()">Flip to Text ↻</button>
        </div>
        <div class="card-body" id="back-body">
          Loading vocabulary...
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <button class="nav-btn btn-back" id="prev-btn" onclick="prevCard()">← Back</button>
    <button class="nav-btn btn-flip" onclick="flipCard()">Flip</button>
    <button class="nav-btn btn-next" id="next-btn" onclick="nextCard()">Next →</button>
  </div>

  <script>
    let flashcards = [];
    let currentIndex = 0;

    const cardElement = document.getElementById('flashcard');
    const frontBody = document.getElementById('front-body');
    const backBody = document.getElementById('back-body');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    async function loadCards() {
      try {
        const response = await fetch(`data.json?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('Failed to load data.json');
        flashcards = await response.json();
        renderCard();
      } catch (error) {
        frontBody.innerHTML = `<p style="color:#dc2626;">Error loading <strong>data.json</strong>. Make sure both files are in the same folder on GitHub.</p>`;
        counter.textContent = '0 / 0';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      }
    }

    function renderCard() {
      if (flashcards.length === 0) return;

      cardElement.classList.remove('is-flipped');

      setTimeout(() => {
        const item = flashcards[currentIndex];

        // Build Front HTML
        let frontHTML = '';
        if (item.context) {
          frontHTML += `<div class="passage-context">${item.context}</div>`;
        }
        if (item.title) {
          frontHTML += `<h2 class="passage-title">${item.title}</h2>`;
        }
        if (Array.isArray(item.passage)) {
          frontHTML += item.passage.map(p => `<p class="passage-paragraph">${p}</p>`).join('');
        } else {
          frontHTML += `<p class="passage-paragraph">${item.passage}</p>`;
        }
        frontBody.innerHTML = frontHTML;
        frontBody.scrollTop = 0;

        // Build Back HTML
        const vocabItemsHTML = item.vocabulary.map(v => `
          <li class="vocab-item">
            <span class="vocab-term">${v.term}</span>
            <span class="vocab-def">${v.definition}</span>
          </li>
        `).join('');
        backBody.innerHTML = `<ul class="vocab-list">${vocabItemsHTML}</ul>`;
        backBody.scrollTop = 0;

        // Update counter & button states
        counter.textContent = `Card ${currentIndex + 1} of ${flashcards.length}`;
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === flashcards.length - 1;
      }, 120);
    }

    function flipCard() {
      cardElement.classList.toggle('is-flipped');
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function shuffleCards() {
      if (flashcards.length <= 1) return;
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    loadCards();
  </script>
</body>
</html>
